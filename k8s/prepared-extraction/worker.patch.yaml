# REVIEWABLE - NOT APPLIED. Pair with adapter-config.yaml and the exact image in README.md.
# Prepare the OCR endpoint and Secret before the owner-approved activation.
spec:
  strategy: {type: Recreate, rollingUpdate: null}   # the processing list has ONE owner: the old pod stops before the new one starts
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: minisforum2          # the hostPath below is node-local
      containers:
      - name: enricher
        image: faisalanjum/report-enricher@sha256:cb980c0daba30dbe61e3d62009daed994a403c50973866af5ccd2af9182d5e6d   # prepared-table-lookup-20261101
        env:
        - name: PREPARED_EXTRACTION_CONFIG             # unset = today's worker path exactly (seam tests 5/5)
          value: /etc/prepared/adapter_config.json
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef: {name: prepared-ocr, key: api-key}
        volumeMounts:
        - {name: prepared-output, mountPath: /data/sec_prepared}
        - {name: prepared-config, mountPath: /etc/prepared, readOnly: true}
      volumes:
      - name: prepared-output
        hostPath: {path: /home/faisal/data/sec_prepared, type: Directory}   # must exist BEFORE the pod starts
      - name: prepared-config
        configMap: {name: prepared-adapter-config}
