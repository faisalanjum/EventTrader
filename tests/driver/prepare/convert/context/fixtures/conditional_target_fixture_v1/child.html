<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Field station</title></head>
<body><main id="station-page"><h1>Specimen station</h1>
<section class="entry"><a class="show-sheet" href="javascript:void(0)" onclick="FieldStation.show(this, 'sheet-larch')">Inspect specimen</a>
<p>Keep this station tidy.</p></section>
<div class="source-store" style="display:none">
<article class="specimen-sheet" id="sheet-larch" style="display:none">
<header><h2>Field observations</h2><a class="close-sheet" href="javascript:void(0)" onclick="FieldStation.close(this)">Close panel</a></header>
<div class="sheet-body">
<a class="section-switch" href="javascript:void(0)" onclick="FieldStation.flip(this)">Overview</a><div><p>Keep trays <strong>shaded</strong>.</p></div>
<a class="section-switch" href="javascript:void(0)" onclick="FieldStation.flip(this)">Open notes</a><div style="display:none"><p>Check trays from the east door.</p><ol><li>Amber tray</li><li>Silver tray</li></ol><a href="https://reference.invalid/field-guide#trays">Field guide</a></div>
<a class="section-switch" href="javascript:void(0)" onclick="FieldStation.flip(this)">Open counts</a><div style="display:none"><table><caption>Stored samples</caption><thead><tr><th scope="col">Material</th><th scope="col">Count</th></tr></thead><tbody><tr><th scope="row">Slate</th><td class="count">8</td></tr><tr><th scope="row">Birch</th><td class="count">13</td></tr></tbody></table><figure><img src="/assets/public-plan.png" alt="Public test plan"><figcaption>Storage plan</figcaption></figure></div>
</div></article></div></main></body></html>
